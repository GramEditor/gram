[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
all-features = true

[advisories]
unmaintained = "none"
unsound = "none"
ignore = [{ id = "RUSTSEC-2023-0071", reason = "RustCrypto/RSA#626" }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [{ crate = "git2", use-instead = "git cli" }, { crate = "gix", use-instead = "git cli" }, { crate = "openssl", use-instead = "rustls" }, { crate = "openssl-sys", use-instead = "rustls" }, "libssh2-sys"]
# TODO: skip or fix duplicate crates. You can try bump some crates and result of 'cargo tree -d' can be useful.
skip = [{ crate = "getrandom@0.2", reason = "Required by ring and other cryptographic crates." }]
skip-tree = [{ crate = "windows-sys", reason = "Foundational crate." }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://codeberg.org/GramEditor/cosmic-text",
  "https://codeberg.org/GramEditor/mermaid-rs-renderer",
  "https://codeberg.org/GramEditor/notify",
  "https://codeberg.org/GramEditor/rust-protobuf-native",
  "https://codeberg.org/NLnetLabs/tree-sitter-roto"
]

[sources.allow-org]
github = ["zed-industries", "microsoft", "tree-sitter", "tree-sitter-grammars", "smol-rs", "camdencheek", "phoenixframework", "nix-community", "6cdh", "DerekStride", "gleam-lang", "the-mikedavis", "gbprod", "WhatsApp"]

[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "BSL-1.0", "MIT", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "WTFPL"]
confidence-threshold = 0.93
exceptions = [{ allow = ["BSD-2-Clause"], crate = "arrayref" }]

[licenses.private]
ignore = true
registries = []
