# yaml-language-server: $schema=https://www.schemastore.org/gitea-issue-forms.json
name: "4: Other"
about: "Other questions or something unrelated."
title: "other: "
labels: ["other"]
body:
  - type: markdown
    attributes:
      value: |
        **NOTE:** This issue tracker is mainly for tracking and dealing with bugs. There is no big team working on Gram, so don't be surprised if issues end up sitting around without much movement.
  - type: markdown
    attributes:
      value: |
        - Please speak English, as it is the only language all maintainers can read and write.
        - Be clear and concise. Overly verbose reports are harder to understand.
        - Be civil, and follow the [Gram Code of Conduct](https://codeberg.org/GramEditor/gram/src/branch/main/CODE_OF_CONDUCT.md).
        - Take a moment to [check that your issue hasn't been reported before](https://codeberg.org/GramEditor/gram/issues).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Please provide a description of your question or issue here.
    validations:
      required: true
