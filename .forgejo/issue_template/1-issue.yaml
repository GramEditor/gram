# yaml-language-server: $schema=https://www.schemastore.org/gitea-issue-forms.json
name: "1: Issue"
about: "Please start here and describe your situation."
title: "problem: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **NOTE:** This issue tracker is mainly for tracking and dealing with bugs. There is no big team working on Gram, so don't be surprised if issues end up sitting around without much movement.
  - type: markdown
    attributes:
      value: |
        **FAQ:**
        - **Is it caused by hardware (e.g., missing support for your particular graphics device)?**
          If so, you are probably the best person to solve this, since you are the one who can reproduce it. Try to figure out the cause yourself and include as much detail as possible. See the debugging guide in the documentation for info on retrieving logs or using a debugger with Gram.
        - **Is it a packaging problem (e.g., missing Windows builds, missing packages for your architecture, or lack of support for a specific Linux distro)?**
          Just like above, you are probably the one most able to fix this yourself. We have a GitHub mirror solely to run GitHub Actions on platforms where we lack Codeberg runners. Contributions to improve workflows for both Forgejo and GitHub are very welcome.
  - type: markdown
    attributes:
      value: |
        - Please speak English, as it is the only language all maintainers can read and write.
        - Be clear and concise. Overly verbose reports are harder to understand.
        - Be civil, and follow the [Gram Code of Conduct](https://codeberg.org/GramEditor/gram/src/branch/main/CODE_OF_CONDUCT.md).
        - Take a moment to [check that your issue hasn't been reported before](https://codeberg.org/GramEditor/gram/issues).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Please provide a description of your issue here.
    validations:
      required: true
  - type: input
    id: gram-ver
    attributes:
      label: Gram Version
      description: Gram version (or commit reference).
  - type: textarea
    id: versions
    attributes:
      label: Other details about your environment (software names and versions)
      description: |
        Please investigate the problem before creating an issue and provide relevant information (see the documentation for details on how to get logs from the editor).
    validations:
      required: true
