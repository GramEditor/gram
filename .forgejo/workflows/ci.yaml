# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: CI

on:
  workflow_dispatch:
    inputs:
      skip_rust_build:
        type: boolean
        default: false
  push:
    branches:
      - main
      - test/*
      - test-fj/*
      - test-release/*
      - test-release-fj/*
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  RUSTUP_MAX_RETRIES: "10"
  CARGO_NET_RETRY: "10"

jobs:
  build:
    name: Build
    if: github.ref_type == 'branch' && !startsWith(github.ref, 'refs/heads/test-release') && !inputs.skip_rust_build
    runs-on: rust-22.04-amd64
    env:
      CC: clang
      CXX: clang++
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - name: Checkout repo
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache build
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-gram-dev-cargo-${{ hashFiles('**/Cargo.lock') }}
          lookup-only: true

      - name: Install dependencies
        run: ./script/prepare-ci ci

      - name: Cargo nextest
        run: cargo nextest run --workspace --no-fail-fast --success-output never --show-progress none

  release:
    name: Release
    if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/test-release') || inputs.skip_rust_build
    runs-on: rust-22.04-amd64
    environment: release
    env:
      CC: clang
      CXX: clang++
      CC_x86_64_unknown_linux_musl: musl-gcc
      GRAM_RPM_COMPRESSION: gzip
    steps:
      - name: Checkout repo
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache build
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            distdir/
          key: ${{ runner.os }}-gram-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          lookup-only: true

      - name: Install dependencies
        if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/test-release')
        run: ./script/prepare-ci release

      - name: Bundle
        if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/test-release')
        run: ./script/bundle-linux --tarball --deb --rpm

      - name: Prepare artifact names
        if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/test-release')
        id: set_artifact_name
        shell: bash
        run: ./script/ci/artifact-name

      - name: Prepare pycargoebuild
        run: ./script/prepare-pycargoebuild

      - name: Generate crate-dist
        if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/test-release')
        id: gen_crate_dist
        shell: bash
        run: ./script/ci/generate-crates

      - name: Release
        if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/test-release')
        uses: forgejo/release@585a6614e80a6bcfc429b956ae34831889cabb78 # v2.13.4
        with:
          direction: upload
          repo: ${{ github.repository }}
          token: ${{ secrets.CODEBERG_PACKAGE_TOKEN }}
          tag: ${{ github.ref_name }}
          release-dir: release

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          DEB_FILE: ${{ steps.set_artifact_name.outputs.deb_amd64 }}
          RPM_FILE: ${{ steps.set_artifact_name.outputs.rpm_amd64 }}
          CRATE_FILE: ${{ steps.gen_crate_dist.outputs.name }}
          REF_NAME: ${{ github.ref_name }}
          TOKEN: ${{ secrets.CODEBERG_PACKAGE_TOKEN }}
        run: ./script/ci/publish-packages
