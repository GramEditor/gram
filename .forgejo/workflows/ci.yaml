# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: CI

on:
  workflow_dispatch:
    inputs:
      skip_rust_build:
        type: boolean
        default: false
  push:
    branches:
      - main
      - test/*
      - test-fj/*
      - test-release/*
      - test-release-fj/*
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  RUSTUP_MAX_RETRIES: "10"
  CARGO_NET_RETRY: "10"

jobs:
  build:
    name: Build
    if: github.ref_type == 'branch' && !startsWith(github.ref, 'refs/heads/test-release') && !inputs.skip_rust_build
    runs-on: rust-22.04-amd64
    env:
      CC: clang
      CXX: clang++
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - name: Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Dependencies
        run: ./script/prepare-ci ci

      - name: Licenses
        run: ./script/check-licenses

      - name: Nextest
        run: cargo nextest run --workspace --no-fail-fast --success-output never --show-progress none

  release:
    name: Release
    if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/test-release') || inputs.skip_rust_build
    runs-on: rust-22.04-amd64
    environment: release
    env:
      CC: clang
      CXX: clang++
      CC_x86_64_unknown_linux_musl: musl-gcc
      GRAM_RPM_COMPRESSION: gzip
    steps:
      - name: Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Dependencies
        if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/test-release')
        run: ./script/prepare-ci release

      - name: Bundle Linux
        if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/test-release')
        run: ./script/bundle-linux --tarball --deb --rpm

      - name: Artifact name
        if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/test-release')
        id: set_artifact_name
        shell: bash
        run: ./script/ci/artifact-name

      - name: Upload tarball
        if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/test-release')
        uses: forgejo/upload-artifact@v5
        with:
          name: ${{ steps.set_artifact_name.outputs.tarball_amd64 }}
          path: ${{ steps.set_artifact_name.outputs.tarball_amd64 }}
          compression-level: 0

      - name: Upload remote server
        if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/test-release')
        uses: forgejo/upload-artifact@v5
        with:
          name: ${{ steps.set_artifact_name.outputs.remote_server_amd64 }}
          path: ${{ steps.set_artifact_name.outputs.remote_server_amd64 }}
          compression-level: 0

      - name: Upload DEB
        if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/test-release')
        uses: forgejo/upload-artifact@v5
        with:
          name: ${{ steps.set_artifact_name.outputs.deb_amd64 }}
          path: ${{ steps.set_artifact_name.outputs.deb_amd64 }}
          compression-level: 0

      - name: Upload RPM
        if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/test-release')
        uses: forgejo/upload-artifact@v5
        with:
          name: ${{ steps.set_artifact_name.outputs.rpm_amd64 }}
          path: ${{ steps.set_artifact_name.outputs.rpm_amd64 }}
          compression-level: 0

      - name: Publish packages
        if: github.ref_type == 'tag'
        env:
          DEB_FILE: ${{ steps.set_artifact_name.outputs.deb_amd64 }}
          RPM_FILE: ${{ steps.set_artifact_name.outputs.rpm_amd64 }}
          CRATE_FILE: ${{ steps.gen_crate_dist.outputs.name }}
          REF_NAME: ${{ github.ref_name }}
          TOKEN: ${{ secrets.CODEBERG_PACKAGE_TOKEN }}
        run: ./script/ci/publish-packages
