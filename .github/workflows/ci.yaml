# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test/*
      - test-gh/*
      - test-release/*
      - test-release-gh/*
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Test (${{ matrix.os }})
    if: github.ref_type == 'branch' && !startsWith(github.ref, 'refs/heads/test-release')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cleanup
        if: runner.os == 'Linux'
        run: ./script/ci-free-space

      - name: Cargo path
        if: runner.os == 'macOS'
        run: echo "/Users/runner/.cargo/bin" >> $GITHUB_PATH

      - name: "Nextest: install"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Dependencies
        if: runner.os == 'Linux'
        run: ./script/prepare-ci ci

      - name: "Nextest: Windows"
        if: runner.os == 'Windows'
        env:
          MAKEOPTS: "-j2 -l2"
          CARGO_BUILD_JOBS: "2"
        run: cargo nextest run --workspace --no-fail-fast --success-output never --show-progress none

      - name: "Nextest: non-Windows"
        if: runner.os != 'Windows'
        run: cargo nextest run --workspace --no-fail-fast --success-output never --show-progress none

  release-linux:
    name: Release Linux (${{ matrix.arch }})
    if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/test-release')
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04 # v24.04
            artifact_name: linux-x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            artifact_name: linux-aarch64
    env:
      CC: clang
      CXX: clang++
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - name: Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Dependencies
        run: ./script/prepare-ci release

      - name: Flatpak dependencies
        run: ./script/flatpak/deps

      - name: Flatpak
        run: ./script/flatpak/bundle-flatpak

      - name: Copy artifacts
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: ./script/ci/github-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*

  release-windows:
    name: Release Windows
    if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/test-release')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x64
    steps:
      - name: Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bundle
        shell: pwsh
        run: script/bundle-windows.ps1 -Architecture x86_64

      - name: List
        shell: bash
        run: ls -la target/*

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Gram-${{ matrix.artifact_name }}-${{ matrix.target }}.exe
          path: target/Gram-x86_64.exe
          if-no-files-found: error

      - name: Upload remote server
        uses: actions/upload-artifact@v7
        with:
          name: gram-remote-server-${{ matrix.artifact_name}}-${{ matrix.target }}.zip
          path: target/gram-remote-server-windows-x86_64.zip
          if-no-files-found: warn
