[package]
name = "gpui"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Gram's GPU-accelerated UI framework"
readme = "README.md"
homepage = "https://gpui.rs"
repository.workspace = true
license = "Apache-2.0"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]
publish = true

[package.metadata.cargo-machete]
ignored = ["embed-resource"]

[lib]
doctest = false
path = "src/gpui.rs"

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "image"
path = "examples/image/image.rs"

[[example]]
name = "input"
path = "examples/input.rs"

[[example]]
name = "on_window_close_quit"
path = "examples/on_window_close_quit.rs"

[[example]]
name = "opacity"
path = "examples/opacity.rs"

[[example]]
name = "pattern"
path = "examples/pattern.rs"

[[example]]
name = "set_menus"
path = "examples/set_menus.rs"

[[example]]
name = "shadow"
path = "examples/shadow.rs"

[[example]]
name = "svg"
path = "examples/svg/svg.rs"

[[example]]
name = "tab_stop"
path = "examples/tab_stop.rs"

[[example]]
name = "text"
path = "examples/text.rs"

[[example]]
name = "text_wrapper"
path = "examples/text_wrapper.rs"

[[example]]
name = "tree"
path = "examples/tree.rs"

[[example]]
name = "uniform_list"
path = "examples/uniform_list.rs"

[[example]]
name = "window_shadow"
path = "examples/window_shadow.rs"

[[example]]
name = "grid_layout"
path = "examples/grid_layout.rs"

[[example]]
name = "mouse_pressure"
path = "examples/mouse_pressure.rs"

[dependencies]
anyhow.workspace = true
async-task = "4.7"
backtrace = { workspace = true, optional = true }
bitflags = { workspace = true, optional = true }
bytemuck = { version = "1", optional = true }
circular-buffer.workspace = true
collections.workspace = true
ctor.workspace = true
derive_more.workspace = true
etagere = "0.3"
futures.workspace = true
gpui_macros.workspace = true
http_client.workspace = true
image.workspace = true
inventory.workspace = true
itertools.workspace = true
libc.workspace = true
log.workspace = true
lyon = "1.0"
num_cpus = "1.13"
parking = "2.0.0"
parking_lot.workspace = true
pin-project = "1.1.10"
postage.workspace = true
profiling.workspace = true
rand = { workspace = true, optional = true }
raw-window-handle = "0.6"
refineable.workspace = true
resvg = { version = "0.47.0", default-features = false, features = ["memmap-fonts", "system-fonts", "text"] }
schemars.workspace = true
seahash = "4.1"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
smol.workspace = true
spin = "0.10.0"
stacksafe.workspace = true
strum.workspace = true
sum_tree.workspace = true
taffy = "0.11"
thiserror.workspace = true
unicode-segmentation.workspace = true
url.workspace = true
usvg = { version = "0.47.0", default-features = false, features = ["text"] }
util.workspace = true
util_macros.workspace = true
uuid.workspace = true
waker-fn = "1.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "110523127440aefb11ce0cf280ae7c5071337ec5", package = "zed-font-kit", version = "0.14.1-zed", optional = true }
foreign-types = "0.5"
log.workspace = true
wgpu = { workspace = true }
cosmic-text = { version = "0.19", optional = true }
swash = "0.2.9"
bytemuck = { version = "1" }
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-color-sync.workspace = true
objc2-core-graphics.workspace = true
objc2-quartz-core.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
pathfinder_geometry = "0.5"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# Always used
flume = "0.11"

# Used in both windowing options
ashpd = { workspace = true, optional = true }
calloop = "0.14.3"
cosmic-text = { version = "0.19", optional = true }
filedescriptor = { version = "0.8.2", optional = true }
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { package = "zed-font-kit", git = "https://github.com/zed-industries/font-kit", rev = "110523127440aefb11ce0cf280ae7c5071337ec5", version = "0.14.1-zed", features = [
  "source-fontconfig-dlopen",
], optional = true }
open = { version = "5.2.0", optional = true }
swash = "0.2.9"
wgpu = { workspace = true, optional = true }
xkbcommon = { version = "0.8.0", features = ["wayland", "x11"], optional = true }

# Wayland
calloop-wayland-source = { version = "0.4.1", optional = true }
wayland-backend = { version = "0.3.3", features = [
  "client_system",
  "dlopen",
], optional = true }
wayland-client = { version = "0.31.2", optional = true }
wayland-cursor = { version = "0.31.1", optional = true }
wayland-protocols = { version = "0.31.2", features = [
  "client",
  "staging",
  "unstable",
], optional = true }
wayland-protocols-plasma = { version = "0.2.0", features = [
  "client",
], optional = true }
wayland-protocols-wlr = { version = "0.3.9", features = [
  "client",
], optional = true }

# X11
as-raw-xcb-connection = { version = "1", optional = true }
x11rb = { version = "0.13.1", features = [
  "allow-unsafe-code",
  "cursor",
  "randr",
  "resource_manager",
  "sync",
  "xinput",
  "xkb",
], optional = true }
# WARNING: If you change this, you must also publish a new version of zed-xim to crates.io
xim = { package = "zed-xim", git = "https://github.com/zed-industries/xim-rs.git", rev = "16f35a2c881b815a2b6cdfd6687988e84f8447d8", version = "0.4.0-zed", features = [
  "x11rb-client",
  "x11rb-xcb",
], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
pathfinder_geometry = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
bytemuck = { version = "1" }
cosmic-text = { version = "0.19", optional = true }
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { package = "zed-font-kit", git = "https://github.com/zed-industries/font-kit", rev = "110523127440aefb11ce0cf280ae7c5071337ec5", version = "0.14.1-zed", optional = true }
foreign-types = "0.5"
log.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-color-sync.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core.workspace = true
swash = "0.2.9"
wgpu = { workspace = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.72"
cbindgen = { version = "0.29", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
flume = "0.11"
rand.workspace = true
windows.workspace = true
windows-core.workspace = true
windows-numerics = "0.2"
windows-registry = "0.5"

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"
windows-registry = "0.5"

[features]
default = ["font-kit", "wayland", "windows-manifest", "x11"]
inspector = ["gpui_macros/inspector"]
leak-detection = ["backtrace"]
test-support = [
  "collections/test-support",
  "http_client/test-support",
  "leak-detection",
  "rand",
  "util/test-support",
  "wayland",
  "x11",
]
wayland = [
  "ashpd/wayland",
  "bitflags",
  "bytemuck",
  "calloop-wayland-source",
  "cosmic-text",
  "filedescriptor",
  "font-kit",
  "open",
  "wayland-backend",
  "wayland-client",
  "wayland-cursor",
  "wayland-protocols",
  "wayland-protocols-plasma",
  "wayland-protocols-wlr",
  "wgpu",
  "xkbcommon",
]
windows-manifest = []
x11 = [
  "as-raw-xcb-connection",
  "ashpd",
  "bytemuck",
  "cosmic-text",
  "filedescriptor",
  "font-kit",
  "open",
  "wgpu",
  "x11rb",
  "xim",
  "xkbcommon",
]

[lints]
workspace = true
